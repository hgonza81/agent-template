name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://agent_template:local-dev-only@127.0.0.1:5433/agent_template_test
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_DB: agent_template_test
          POSTGRES_USER: agent_template
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_template -d agent_template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies
        run: |
          uv export --locked --format requirements.txt --no-emit-project \
            --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uv run pip-audit --strict --require-hashes \
            --requirement "$RUNNER_TEMP/backend-requirements.txt"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest

      - name: Export OpenAPI contract
        run: |
          uv run python -m agent_template_api.export_openapi
          git -C .. diff --exit-code -- openapi/openapi.json

      - name: Build backend package
        run: uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate frontend API types
        run: |
          npm run generate:api
          git -C .. diff --exit-code -- frontend/src/generated/Api.ts

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image (not pushed)
        run: |
          docker build --pull --tag "agent-template-${{ matrix.name }}:ci" \
            "${{ matrix.context }}"

      - name: Scan ${{ matrix.name }} image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: agent-template-${{ matrix.name }}:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: '1'
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize without a backend or credentials
        run: terraform init -backend=false -input=false -lockfile=readonly

      - name: Validate
        run: terraform validate

      - name: Security and policy scan
        run: |
          python3 -m pip install --user 'checkov==3.2.*'
          "$HOME/.local/bin/checkov" --directory . --framework terraform \
            --quiet --compact
