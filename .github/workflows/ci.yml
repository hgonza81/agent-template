name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CORS_ALLOWED_ORIGINS: '["http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://agent_template:local-dev-only@127.0.0.1:5433/agent_template_test
    defaults:
      run:
        shell: bash
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine@sha256:3540c0362c809df084ffac0ae69fe794515f9de92692f02178bcdce0ef0302ac
        env:
          POSTGRES_DB: agent_template_test
          POSTGRES_USER: agent_template
          POSTGRES_PASSWORD: local-dev-only
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agent_template -d agent_template_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install backend dependencies
        run: uv sync --frozen

      - name: Audit Python dependencies
        run: |
          uv export --locked --format requirements.txt --no-emit-project \
            --output-file "$RUNNER_TEMP/backend-requirements.txt"
          uv run pip-audit --strict --require-hashes \
            --requirement "$RUNNER_TEMP/backend-requirements.txt"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src tests

      - name: Unit tests
        run: uv run pytest

      - name: Export OpenAPI contract
        run: |
          uv run python -m agent_template_api.export_openapi
          git -C .. diff --exit-code -- openapi/openapi.json

      - name: Build backend package
        run: uv build

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate frontend API types
        run: |
          npm run generate:api
          git -C .. diff --exit-code -- frontend/src/generated/Api.ts

      - name: Audit npm dependencies
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            image: ghcr.io/hgonza81/agent-template-api
          - name: frontend
            context: frontend
            image: ghcr.io/hgonza81/agent-template-web
    env:
      # Public build-time values for the frontend bundle (repository variables,
      # not secrets). Unset variables fall back to blank / the dev API.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ca-agent-template-dev-api.gentlebush-bbce5bd2.centralus.azurecontainerapps.io' }}
      VITE_ENTRA_AUTHORITY: ${{ vars.VITE_ENTRA_AUTHORITY }}
      VITE_ENTRA_CLIENT_ID: ${{ vars.VITE_ENTRA_CLIENT_ID }}
      VITE_API_SCOPES: ${{ vars.VITE_API_SCOPES }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} image (not pushed)
        run: |
          args=()
          if [ "${{ matrix.name }}" = "frontend" ]; then
            args+=(
              --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL"
              --build-arg "VITE_ENTRA_AUTHORITY=$VITE_ENTRA_AUTHORITY"
              --build-arg "VITE_ENTRA_CLIENT_ID=$VITE_ENTRA_CLIENT_ID"
              --build-arg "VITE_API_SCOPES=$VITE_API_SCOPES"
            )
          fi
          docker build --pull "${args[@]}" \
            --tag "${{ matrix.image }}:${{ github.sha }}" \
            "${{ matrix.context }}"

      - name: Scan ${{ matrix.name }} image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ github.sha }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      # Hand the exact scanned image to the publish job (never rebuilt there).
      - name: Save scanned ${{ matrix.name }} image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save "${{ matrix.image }}:${{ github.sha }}" --output "$RUNNER_TEMP/${{ matrix.name }}.tar"

      - name: Upload scanned ${{ matrix.name }} image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.name }}
          path: ${{ runner.temp }}/${{ matrix.name }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    # Only trusted pushes to main; never pull requests or forks. Runs only when
    # every scan above passed. No Azure credentials; GITHUB_TOKEN only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [containers]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      api_image: ${{ steps.push.outputs.api_image }}
      web_image: ${{ steps.push.outputs.web_image }}
    steps:
      - name: Download scanned images
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Push images and record digests
        id: push
        run: |
          echo "### Published images (immutable digests)" >> "$GITHUB_STEP_SUMMARY"
          for pair in backend:api:agent-template-api frontend:web:agent-template-web; do
            IFS=: read -r name key repo <<<"$pair"
            image="ghcr.io/hgonza81/$repo"
            docker load --input "$RUNNER_TEMP/images/$name.tar"
            docker push "$image:${{ github.sha }}"
            digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image:${{ github.sha }}")"
            case "$digest" in
              "$image"@sha256:*) ;;
              *) echo "Unexpected digest reference for $name" >&2; exit 1 ;;
            esac
            echo "${key}_image=$digest" >> "$GITHUB_OUTPUT"
            echo "- \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24.11'

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Scan repository history for secrets
        run: gitleaks git --redact --no-banner

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TF_IN_AUTOMATION: '1'
    defaults:
      run:
        shell: bash
        working-directory: infra/terraform
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: '1.17.1'
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Initialize and validate each root without a backend or credentials
        run: |
          for dir in bootstrap environments/dev; do
            (cd "$dir" && terraform init -backend=false -input=false -lockfile=readonly && terraform validate)
          done

      - name: Security and policy scan
        run: |
          python3 -m pip install --user 'checkov==3.2.*'
          "$HOME/.local/bin/checkov" --directory . --framework terraform \
            --quiet --compact
